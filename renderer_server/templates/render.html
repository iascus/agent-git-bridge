<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <title>Imported content</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        --border: color-mix(in srgb, CanvasText 18%, transparent);
        --muted: color-mix(in srgb, CanvasText 62%, transparent);
        --code-bg: color-mix(in srgb, CanvasText 7%, transparent);
        --add-bg: light-dark(#eaf8ed, #14351d);
        --add-fg: light-dark(#126128, #baf0c5);
        --del-bg: light-dark(#fdeceb, #451a1a);
        --del-fg: light-dark(#9f1c1c, #ffc4c0);
        --word-add-bg: light-dark(#9be9a8, #286b38);
        --word-del-bg: light-dark(#ffb8b4, #8b3434);
        --hunk-bg: light-dark(#eef3ff, #172642);
        --hunk-fg: light-dark(#224b9b, #b9ceff);
      }

      body {
        margin: 0;
        background: Canvas;
        color: CanvasText;
        overflow-x: hidden;
      }

      main {
        margin: 0;
        padding: 0;
      }

      header {
        display: none;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 20px;
        padding-bottom: 14px;
      }

      h1 {
        font-size: 1.1rem;
        margin: 0;
      }

      #kind {
        font-size: 0.9rem;
        opacity: 0.72;
      }

      #content {
        box-sizing: border-box;
        max-width: 100vw;
        min-height: 60vh;
        overflow-x: hidden;
      }

      .markdown {
        box-sizing: border-box;
        width: 100%;
        max-width: none;
        font-size: 1rem;
        line-height: 1.65;
        padding: 24px;
      }

      .markdown h1,
      .markdown h2,
      .markdown h3,
      .markdown h4,
      .markdown h5,
      .markdown h6 {
        line-height: 1.25;
        margin: 1.4em 0 0.45em;
      }

      .markdown h1:first-child,
      .markdown h2:first-child,
      .markdown h3:first-child {
        margin-top: 0;
      }

      .toc {
        border: 1px solid var(--border);
        border-radius: 8px;
        margin: 0 0 24px;
        padding: 14px 16px;
      }

      .toc h2 {
        font-size: 0.95rem;
        margin: 0 0 8px;
      }

      .toc ol {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .toc li {
        margin: 4px 0;
        padding-left: calc((var(--toc-level) - 1) * 16px);
      }

      .toc a {
        color: inherit;
        text-decoration: none;
      }

      .toc a:hover {
        text-decoration: underline;
      }

      .heading-anchor {
        color: var(--muted);
        font-weight: 400;
        margin-left: 0.28em;
        opacity: 0;
        text-decoration: none;
      }

      .markdown :is(h1, h2, h3, h4, h5, h6):hover .heading-anchor,
      .heading-anchor:focus {
        opacity: 1;
      }

      .markdown p,
      .markdown ul,
      .markdown ol,
      .markdown table,
      .markdown blockquote {
        margin: 0 0 1em;
      }

      .markdown table {
        border-collapse: collapse;
        display: block;
        max-width: 100%;
        overflow-x: auto;
        width: 100%;
      }

      .markdown th,
      .markdown td {
        border: 1px solid var(--border);
        padding: 6px 8px;
        text-align: left;
        vertical-align: top;
      }

      .markdown th {
        background: var(--code-bg);
        font-weight: 700;
      }

      .markdown blockquote {
        border-left: 4px solid var(--border);
        color: var(--muted);
        padding-left: 14px;
      }

      .markdown code,
      .markdown pre,
      .plain-text {
        font: 0.92rem/1.5 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      }

      .diff-view {
        font: 1rem/1.65 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      }

      .markdown code {
        background: var(--code-bg);
        border-radius: 4px;
        padding: 0.08rem 0.28rem;
      }

      .markdown pre,
      .plain-text {
        box-sizing: border-box;
        overflow: auto;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: var(--code-bg);
        white-space: pre-wrap;
        word-break: break-word;
      }

      .markdown pre code {
        background: transparent;
        border-radius: 0;
        padding: 0;
      }

      .markdown mjx-container {
        max-width: 100%;
      }

      .markdown mjx-container[display="true"] {
        overflow-x: auto;
        overflow-y: hidden;
        padding: 0.2em 0;
      }

      .diff-view {
        overflow: auto;
        border: 0;
        border-radius: 0;
      }

      .diff-toc {
        background: var(--code-bg);
        border-bottom: 1px solid var(--border);
        padding: 16px 20px 18px;
      }

      .diff-toc-heading {
        align-items: baseline;
        display: flex;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 0.82rem;
        font-weight: 700;
        gap: 8px;
        letter-spacing: 0.06em;
        margin-bottom: 8px;
        text-transform: uppercase;
      }

      .diff-toc-count {
        color: var(--muted);
        font-weight: 500;
      }

      .diff-toc ol {
        column-gap: 28px;
        columns: 280px;
        list-style-position: inside;
        margin: 0;
        padding: 0;
      }

      .diff-toc li {
        break-inside: avoid;
        margin: 2px 0;
      }

      .diff-toc a {
        color: inherit;
        overflow-wrap: anywhere;
        text-decoration-color: transparent;
        text-underline-offset: 0.2em;
        transition: color 120ms ease, text-decoration-color 120ms ease;
      }

      .diff-toc a:hover,
      .diff-toc a:focus-visible {
        color: var(--hunk-fg);
        text-decoration-color: currentColor;
      }

      .diff-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }

      .diff-table td {
        padding: 0 4px;
        vertical-align: top;
      }

      .diff-code {
        overflow-wrap: anywhere;
        padding-left: 8px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .diff-add {
        background: var(--add-bg);
      }

      .diff-del {
        background: var(--del-bg);
      }

      .diff-word-add,
      .diff-word-del {
        border-radius: 3px;
        font-weight: 700;
      }

      .diff-word-add {
        background: var(--word-add-bg);
        color: CanvasText;
      }

      .diff-word-del {
        background: var(--word-del-bg);
        color: CanvasText;
      }

      .diff-hunk,
      .diff-file {
        background: var(--hunk-bg);
        color: var(--hunk-fg);
        font-weight: 600;
      }

      .diff-file-anchor {
        scroll-margin-top: 12px;
      }

      .diff-file-anchor:target .diff-code {
        box-shadow: inset 4px 0 0 currentColor;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Imported content</h1>
        <span id="kind">Loading...</span>
      </header>
      <section id="content" aria-live="polite"></section>
    </main>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: { "[+]": [["$", "$"]] },
          processEscapes: true
        },
        svg: {
          fontCache: "global"
        }
      };
    </script>
    <script defer src="/static/mathjax.min.js"></script>
    <script src="/static/jsdiff.min.js"></script>
    <script>
      const contentElement = document.getElementById("content");
      const kindElement = document.getElementById("kind");
      const importedContent = __IMPORTED_CONTENT_JSON__;
      const importedKind = __IMPORTED_KIND_JSON__;

      function stripLeadingBom(text) {
        return text.charCodeAt(0) === 0xfeff ? text.slice(1) : text;
      }

      function detectKind(text) {
        const normalizedText = stripLeadingBom(text);
        const firstContentLine = normalizedText
          .replace(/\r\n?/g, "\n")
          .split("\n")
          .find((line) => line.trim() !== "") || "";
        if (/^(diff\b|---\s|\+\+\+\s|@@\s)/.test(firstContentLine)) return "diff";

        if (/^#{1,6}\s|\[[^\]]+\]\([^)]+\)|```|~~~|^\s*[-*]\s+|\\\(|\\\[|\$\$/m.test(normalizedText)) return "markdown";

        return "text";
      }

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function sanitizeUrl(value) {
        const trimmed = value.trim();
        if (/^(https?:|mailto:|tel:|#|\/)/i.test(trimmed)) return trimmed;
        return "#";
      }

      function renderInlineMarkdown(text) {
        let html = escapeHtml(text);
        html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
        html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
        html = html.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_match, label, url) => {
          const href = escapeHtml(sanitizeUrl(url));
          return `<a href="${href}" rel="noreferrer">${label}</a>`;
        });
        return html;
      }

      function parseTableRow(line) {
        const trimmed = line.trim();
        if (!trimmed.includes("|")) return null;
        const withoutEdges = trimmed.replace(/^\|/, "").replace(/\|$/, "");
        return withoutEdges.split("|").map((cell) => cell.trim());
      }

      function isTableSeparator(line) {
        const cells = parseTableRow(line);
        return Boolean(cells && cells.length > 1 && cells.every((cell) => /^:?-{3,}:?$/.test(cell)));
      }

      function renderTable(headerCells, bodyRows) {
        const head = headerCells.map((cell) => `<th>${renderInlineMarkdown(cell)}</th>`).join("");
        const body = bodyRows
          .map((row) => `<tr>${row.map((cell) => `<td>${renderInlineMarkdown(cell)}</td>`).join("")}</tr>`)
          .join("");
        return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
      }

      function plainHeadingText(markdown) {
        return markdown
          .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
          .replace(/[`*_~]/g, "")
          .trim();
      }

      function slugifyHeading(text) {
        const slug = text
          .toLowerCase()
          .normalize("NFKD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9\s-]/g, "")
          .trim()
          .replace(/\s+/g, "-")
          .replace(/-+/g, "-");
        return slug || "section";
      }

      function uniqueHeadingId(text, usedIds) {
        const base = slugifyHeading(text);
        const count = usedIds.get(base) || 0;
        usedIds.set(base, count + 1);
        return count === 0 ? base : `${base}-${count + 1}`;
      }

      function renderTableOfContents(items) {
        if (!items.length) return "";
        const links = items
          .map((item) => {
            const level = Math.min(Math.max(item.level, 1), 6);
            return `<li style="--toc-level: ${level}"><a href="#${escapeHtml(item.id)}">${escapeHtml(item.text)}</a></li>`;
          })
          .join("");
        return `<nav class="toc" aria-label="Table of contents"><h2>Contents</h2><ol>${links}</ol></nav>`;
      }

      function renderMarkdown(text) {
        const lines = stripLeadingBom(text).replace(/\r\n?/g, "\n").split("\n");
        const parts = [];
        const tocItems = [];
        const usedHeadingIds = new Map();
        let paragraph = [];
        let listItems = [];
        let quoteLines = [];
        let codeLines = [];
        let inCode = false;

        function flushParagraph() {
          if (!paragraph.length) return;
          parts.push(`<p>${renderInlineMarkdown(paragraph.join(" "))}</p>`);
          paragraph = [];
        }

        function flushList() {
          if (!listItems.length) return;
          parts.push(`<ul>${listItems.map((item) => `<li>${renderInlineMarkdown(item)}</li>`).join("")}</ul>`);
          listItems = [];
        }

        function flushQuote() {
          if (!quoteLines.length) return;
          parts.push(`<blockquote>${quoteLines.map((line) => `<p>${renderInlineMarkdown(line)}</p>`).join("")}</blockquote>`);
          quoteLines = [];
        }

        function flushBlocks() {
          flushParagraph();
          flushList();
          flushQuote();
        }

        for (let index = 0; index < lines.length; index++) {
          const line = lines[index];
          if (line.startsWith("```")) {
            if (inCode) {
              parts.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
              codeLines = [];
              inCode = false;
            } else {
              flushBlocks();
              inCode = true;
            }
            continue;
          }

          if (inCode) {
            codeLines.push(line);
            continue;
          }

          if (!line.trim()) {
            flushBlocks();
            continue;
          }

          const tableHeader = parseTableRow(line);
          if (tableHeader && isTableSeparator(lines[index + 1] || "")) {
            flushBlocks();
            index += 2;
            const bodyRows = [];
            while (index < lines.length) {
              const row = parseTableRow(lines[index]);
              if (!row) break;
              bodyRows.push(row);
              index++;
            }
            index--;
            parts.push(renderTable(tableHeader, bodyRows));
            continue;
          }

          const heading = line.match(/^(#{1,6})\s+(.+)$/);
          if (heading) {
            flushBlocks();
            const level = heading[1].length;
            const headingText = plainHeadingText(heading[2]);
            const id = uniqueHeadingId(headingText, usedHeadingIds);
            tocItems.push({ level, text: headingText, id });
            parts.push(
              `<h${level} id="${escapeHtml(id)}">${renderInlineMarkdown(heading[2])}<a class="heading-anchor" href="#${escapeHtml(id)}" aria-label="Link to ${escapeHtml(headingText)}">#</a></h${level}>`
            );
            continue;
          }

          const listItem = line.match(/^\s*[-*]\s+(.+)$/);
          if (listItem) {
            flushParagraph();
            flushQuote();
            listItems.push(listItem[1]);
            continue;
          }

          const quote = line.match(/^>\s?(.*)$/);
          if (quote) {
            flushParagraph();
            flushList();
            quoteLines.push(quote[1]);
            continue;
          }

          flushList();
          flushQuote();
          paragraph.push(line.trim());
        }

        if (inCode) {
          parts.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
        }
        flushBlocks();

        const wrapper = document.createElement("article");
        wrapper.className = "markdown";
        wrapper.innerHTML = `${renderTableOfContents(tocItems)}${parts.join("\n")}` || "<p></p>";
        return wrapper;
      }

      function renderDiff(text) {
        const wrapper = document.createElement("div");
        wrapper.className = "diff-view";
        const table = document.createElement("table");
        table.className = "diff-table";
        const tbody = document.createElement("tbody");

        const lines = stripLeadingBom(text).replace(/\r\n?/g, "\n").split("\n");
        const lineTypes = buildDiffLineTypes(lines);
        const wordChanges = findWordChanges(lines, lineTypes);
        const fileSections = findDiffFileSections(lines, lineTypes);
        const sectionsByLine = new Map(fileSections.map((section) => [section.lineIndex, section]));

        lines.forEach((line, index) => {
          const row = document.createElement("tr");
          const code = document.createElement("td");

          code.className = "diff-code";
          const changes = wordChanges.get(index);
          if (changes) {
            const marker = document.createElement("span");
            marker.textContent = line[0];
            code.append(marker, renderWordChanges(changes, line[0] === "+" ? "add" : "del"));
          } else {
            code.textContent = line || " ";
          }

          if (lineTypes[index] === "add") row.classList.add("diff-add");
          else if (lineTypes[index] === "del") row.classList.add("diff-del");
          else if (lineTypes[index] === "hunk") row.classList.add("diff-hunk");
          else if (lineTypes[index] === "file") row.classList.add("diff-file");

          const fileSection = sectionsByLine.get(index);
          if (fileSection) {
            row.id = fileSection.id;
            row.classList.add("diff-file-anchor");
          }

          row.append(code);
          tbody.append(row);
        });

        table.append(tbody);
        const toc = renderDiffTableOfContents(fileSections);
        if (toc) wrapper.append(toc);
        wrapper.append(table);
        return wrapper;
      }

      function normalizeDiffPath(path) {
        let normalized = path.trim();
        if (normalized.startsWith('"') && normalized.endsWith('"')) {
          try {
            normalized = JSON.parse(normalized);
          } catch (_error) {
            normalized = normalized.slice(1, -1);
          }
        }
        return normalized.replace(/^[ab]\//, "");
      }

      function fileHeaderPath(line) {
        const value = line.slice(4).split("\t", 1)[0].trim();
        return normalizeDiffPath(value);
      }

      function diffCommandPath(line) {
        if (line.startsWith("diff --git ")) {
          const match = line.match(/^diff --git (?:"(?:\\.|[^"])*"|\S+) ("(?:\\.|[^"])*"|\S+)$/);
          return match ? normalizeDiffPath(match[1]) : "Changed file";
        }
        return normalizeDiffPath(line.slice(5)) || "Changed file";
      }

      function findDiffFileSections(lines, lineTypes) {
        const sections = [];
        let pendingOld = null;
        let sectionAwaitingHeaders = null;

        const addSection = (lineIndex, filename, awaitingHeaders) => {
          const section = {
            id: `diff-file-${sections.length + 1}`,
            lineIndex,
            filename: filename || "Changed file"
          };
          sections.push(section);
          sectionAwaitingHeaders = awaitingHeaders ? section : null;
        };

        lines.forEach((line, lineIndex) => {
          if (/^diff\b/.test(line)) {
            addSection(lineIndex, diffCommandPath(line), true);
            pendingOld = null;
            return;
          }

          if (line.startsWith("Index: ")) {
            addSection(lineIndex, normalizeDiffPath(line.slice(7)), true);
            pendingOld = null;
            return;
          }

          if (lineTypes[lineIndex] === "file" && line.startsWith("--- ")) {
            pendingOld = { lineIndex, filename: fileHeaderPath(line) };
            return;
          }

          if (lineTypes[lineIndex] !== "file" || !line.startsWith("+++ ") || !pendingOld) return;

          const newFilename = fileHeaderPath(line);
          const filename = newFilename === "/dev/null" ? pendingOld.filename : newFilename;
          if (sectionAwaitingHeaders) {
            sectionAwaitingHeaders.filename = filename;
            sectionAwaitingHeaders = null;
          } else {
            addSection(pendingOld.lineIndex, filename, false);
          }
          pendingOld = null;
        });

        return sections;
      }

      function renderDiffTableOfContents(fileSections) {
        if (fileSections.length === 0) return null;

        const nav = document.createElement("nav");
        nav.className = "diff-toc";
        nav.setAttribute("aria-label", "Changed files");

        const heading = document.createElement("div");
        heading.className = "diff-toc-heading";
        heading.append(document.createTextNode("Changed files"));
        const count = document.createElement("span");
        count.className = "diff-toc-count";
        count.textContent = String(fileSections.length);
        heading.append(count);

        const list = document.createElement("ol");
        fileSections.forEach((section) => {
          const item = document.createElement("li");
          const link = document.createElement("a");
          link.href = `#${section.id}`;
          link.textContent = section.filename;
          item.append(link);
          list.append(item);
        });

        nav.append(heading, list);
        return nav;
      }

      function tokenizeDiffText(text) {
        return text.match(/\s+|[\p{L}\p{N}_]+|[^\s\p{L}\p{N}_]+/gu) || [];
      }

      function jsDiffWords(oldText, newText) {
        if (!window.Diff || typeof window.Diff.diffWordsWithSpace !== "function") return null;
        const changes = window.Diff.diffWordsWithSpace(oldText, newText, { timeout: 1000 });
        if (!changes) return null;

        const oldResult = [];
        const newResult = [];
        changes.forEach((change) => {
          const part = { text: change.value, changed: Boolean(change.added || change.removed) };
          if (change.added) {
            newResult.push(part);
          } else if (change.removed) {
            oldResult.push(part);
          } else {
            oldResult.push(part);
            newResult.push({ text: change.value, changed: false });
          }
        });
        return { oldResult, newResult };
      }

      function parseHunkCounts(line) {
        const match = line.match(/^@@\s+-\d+(?:,(\d+))?\s+\+\d+(?:,(\d+))?/);
        if (!match) return null;
        return {
          oldRemaining: match[1] === undefined ? 1 : Number(match[1]),
          newRemaining: match[2] === undefined ? 1 : Number(match[2])
        };
      }

      function buildDiffLineTypes(lines) {
        const types = [];
        let hunk = null;

        lines.forEach((line, index) => {
          if (/^diff\b/.test(line)) {
            types[index] = "file";
            hunk = null;
            return;
          }

          const parsedHunk = parseHunkCounts(line);
          if (parsedHunk) {
            types[index] = "hunk";
            hunk = parsedHunk;
            return;
          }

          if (!hunk) {
            types[index] = line.startsWith("---") || line.startsWith("+++") ? "file" : "context";
            return;
          }

          if (line.startsWith("\\ No newline")) {
            types[index] = "context";
            return;
          }

          if (line.startsWith("-")) {
            types[index] = "del";
            hunk.oldRemaining = Math.max(0, hunk.oldRemaining - 1);
          } else if (line.startsWith("+")) {
            types[index] = "add";
            hunk.newRemaining = Math.max(0, hunk.newRemaining - 1);
          } else {
            types[index] = "context";
            hunk.oldRemaining = Math.max(0, hunk.oldRemaining - 1);
            hunk.newRemaining = Math.max(0, hunk.newRemaining - 1);
          }

          if (hunk.oldRemaining === 0 && hunk.newRemaining === 0) {
            hunk = null;
          }
        });

        return types;
      }

      function diffWords(oldText, newText) {
        const jsDiffResult = jsDiffWords(oldText, newText);
        if (jsDiffResult) return jsDiffResult;

        const oldTokens = tokenizeDiffText(oldText);
        const newTokens = tokenizeDiffText(newText);
        if (oldTokens.length * newTokens.length > 100000) {
          return {
            oldResult: [{ text: oldText, changed: true }],
            newResult: [{ text: newText, changed: true }]
          };
        }
        const table = Array.from(
          { length: oldTokens.length + 1 },
          () => new Uint32Array(newTokens.length + 1)
        );

        for (let oldIndex = oldTokens.length - 1; oldIndex >= 0; oldIndex--) {
          for (let newIndex = newTokens.length - 1; newIndex >= 0; newIndex--) {
            table[oldIndex][newIndex] = oldTokens[oldIndex] === newTokens[newIndex]
              ? table[oldIndex + 1][newIndex + 1] + 1
              : Math.max(table[oldIndex + 1][newIndex], table[oldIndex][newIndex + 1]);
          }
        }

        const oldResult = [];
        const newResult = [];
        let oldIndex = 0;
        let newIndex = 0;
        while (oldIndex < oldTokens.length || newIndex < newTokens.length) {
          if (
            oldIndex < oldTokens.length &&
            newIndex < newTokens.length &&
            oldTokens[oldIndex] === newTokens[newIndex]
          ) {
            oldResult.push({ text: oldTokens[oldIndex], changed: false });
            newResult.push({ text: newTokens[newIndex], changed: false });
            oldIndex++;
            newIndex++;
          } else if (
            newIndex < newTokens.length &&
            (oldIndex === oldTokens.length ||
              table[oldIndex][newIndex + 1] >= table[oldIndex + 1][newIndex])
          ) {
            newResult.push({ text: newTokens[newIndex], changed: true });
            newIndex++;
          } else {
            oldResult.push({ text: oldTokens[oldIndex], changed: true });
            oldIndex++;
          }
        }
        return { oldResult, newResult };
      }

      function findWordChanges(lines, lineTypes) {
        const changes = new Map();
        let index = 0;
        while (index < lines.length) {
          if (lineTypes[index] !== "del") {
            index++;
            continue;
          }

          const deleted = [];
          while (index < lines.length && lineTypes[index] === "del") {
            deleted.push(index++);
          }
          const added = [];
          while (index < lines.length && lineTypes[index] === "add") {
            added.push(index++);
          }

          if (added.length === 0) continue;

          const oldText = deleted.map((lineIndex) => lines[lineIndex].slice(1)).join("\n");
          const newText = added.map((lineIndex) => lines[lineIndex].slice(1)).join("\n");
          const result = diffWords(oldText, newText);
          assignWordChangesToLines(result.oldResult, deleted, changes);
          assignWordChangesToLines(result.newResult, added, changes);
        }
        return changes;
      }

      function assignWordChangesToLines(parts, lineIndexes, changes) {
        const lineParts = lineIndexes.map(() => []);
        let lineOffset = 0;

        parts.forEach((part) => {
          const segments = part.text.split("\n");
          segments.forEach((segment, segmentIndex) => {
            if (segment && lineOffset < lineParts.length) {
              lineParts[lineOffset].push({ text: segment, changed: part.changed });
            }
            if (segmentIndex < segments.length - 1) lineOffset++;
          });
        });

        lineIndexes.forEach((lineIndex, offset) => {
          changes.set(lineIndex, lineParts[offset]);
        });
      }

      function renderWordChanges(parts, kind) {
        const fragment = document.createDocumentFragment();
        parts.forEach((part) => {
          if (!part.changed) {
            fragment.append(document.createTextNode(part.text));
            return;
          }
          const span = document.createElement("span");
          span.className = kind === "add" ? "diff-word-add" : "diff-word-del";
          span.textContent = part.text;
          fragment.append(span);
        });
        return fragment;
      }

      function renderPlainText(text) {
        const pre = document.createElement("pre");
        pre.className = "plain-text";
        pre.textContent = text;
        return pre;
      }

      function renderContent(text, knownKind) {
        const kind = knownKind || detectKind(text);
        kindElement.textContent = kind;
        contentElement.replaceChildren(
          kind === "markdown" ? renderMarkdown(text) :
          kind === "diff" ? renderDiff(text) :
          renderPlainText(text)
        );
      }

      try {
        renderContent(importedContent, importedKind);
      } catch (error) {
        kindElement.textContent = "error";
        contentElement.replaceChildren(renderPlainText(error.message));
      }
    </script>
  </body>
</html>
