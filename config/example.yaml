# Example configuration for a Linux host (systemd); for Windows see
# example.windows.yaml. Copy to /etc/git-bridge/config.yaml and edit.
# Only repositories and branches listed here can ever be touched.
# Secrets are separate files referenced by path, never stored in Git.

work_dir: /var/lib/git-bridge/work             # temporary publication worktrees
audit_log: /var/lib/git-bridge/audit.jsonl     # append-only JSON Lines
github_token_file: /etc/git-bridge/github-token   # fine-grained PAT, mode 0600

server:
  host: 127.0.0.1                  # loopback only; Tailscale Serve provides HTTPS
  port: 8000
  bearer_token_file: /etc/git-bridge/bearer-token

snapshot:
  transport: google_drive          # or: local (with local_root), none

google:
  client_secrets_file: /etc/git-bridge/google-client.json
  token_file: /var/lib/git-bridge/google-token.json

git_identity:
  name: Git Bridge
  email: git-bridge@users.noreply.github.com

limits:
  max_archive_bytes: 5242880            # 5 MiB compressed upload
  max_uncompressed_bytes: 20971520      # 20 MiB total after decompression
  max_member_bytes: 16777216            # 16 MiB per archive member
  max_entries: 8

# Each key is the stable name used in URLs (/repos/<key>/publish). Every
# repository gets its own bare clone, lock and Drive folder; GitHub names,
# local_path and drive_root must not overlap between repositories.
repositories:
  rot3k:
    # The GitHub repository is currently named rt3k. After renaming it on
    # GitHub, set github_repo: iascus/rot3k and former_github_repos: [iascus/rt3k]
    # — the URL key, Shortcuts and Drive folder stay the same, in-flight
    # artifacts naming rt3k are still accepted, and the clone is re-pointed.
    github_repo: iascus/rt3k
    former_github_repos: []
    local_path: /var/lib/git-bridge/repos/rot3k   # persistent bare clone
    remote: origin
    # remote_url defaults to https://github.com/<github_repo>.git

    allowed_branches:
      - design-docs

    # Staged paths matching these globs are rejected.
    denied_paths:
      - .github/**

    # Always run first (built in): git diff --cached --check
    # Additional commands run in the temporary worktree, no shell, minimal env.
    validation: []
    #  - name: markdown-lint
    #    command: ["markdownlint-cli2", "**/*.md"]
    #    timeout_seconds: 120

    export:
      drive_root: ChatGPT/rot3k
      # Either: let the repository's manifest define the exported set, e.g.
      #   manifest: docs/design/MANIFEST.md
      # (reads its PROJECT_SOURCE_FILES / PROJECT_SOURCE_MATERIALIZATION
      # blocks at the exported commit), or: glob rules as below.
      bootstrap:
        - MANIFEST.md
        - PROJECT_WORKFLOW.md
        - AGENTS.md
        - docs/**/*.md
      lazy:
        - characters/**/*.md
        - records/**/*.md
        - romance/**/*.md
      indexes:
        - characters/index*.json
        - characters/index*.md
      exclude: []
    # After each successful push, open a PR from the branch into base
    # unless one is already open. Needs 'Pull requests: Read and write'.
    pull_request:
      base: main
      draft: false

  cyberpunk-tactics:
    github_repo: iascus/cyberpunk-tactics
    local_path: /var/lib/git-bridge/repos/cyberpunk-tactics
    allowed_branches:
      - design-docs
    denied_paths:
      - .github/**
    validation: []
    export:
      drive_root: ChatGPT/cyberpunk-tactics
      bootstrap:
        - "*.md"
        - docs/**/*.md
      lazy:
        - "**/*.md"
      indexes: []
      exclude: []
