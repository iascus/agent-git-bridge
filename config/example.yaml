# Example configuration for a Linux host (systemd); for Windows see
# example.windows.yaml. Copy to /etc/git-bridge/config.yaml and edit.
# Only the repositories and branches configured here can ever be touched.
# Secrets are separate files referenced by path, never stored in Git.

work_dir: /var/lib/git-bridge/work             # temporary push worktrees
audit_log: /var/lib/git-bridge/audit.jsonl     # append-only JSON Lines
github_token_file: /etc/git-bridge/github-token   # fine-grained PAT, mode 0600

server:
  host: 127.0.0.1                  # loopback only; Tailscale Serve provides HTTPS
  port: 8000
  bearer_token_file: /etc/git-bridge/bearer-token

snapshot:
  transport: google_drive          # or: local (with local_root), none

google:
  client_secrets_file: /etc/git-bridge/google-client.json
  token_file: /var/lib/git-bridge/google-token.json

git_identity:                    # author and committer of every bridge commit
  name: iascus
  email: 127579634+iascus@users.noreply.github.com

limits:
  max_archive_bytes: 5242880            # 5 MiB compressed upload
  max_uncompressed_bytes: 20971520      # 20 MiB total after decompression
  max_member_bytes: 16777216            # 16 MiB per archive member
  max_entries: 8

# Each key is the stable project key used in URLs (/repos/<key>/push) and
# artifact names; it is independent of the GitHub repository name. Every
# repository gets its own bare clone, lock and Drive folder; GitHub names,
# local_path and drive_root must not overlap between repositories.
repositories:
  rot3k:
    # Renamed on GitHub from rt3k: the key, Shortcuts and Drive folder stay the
    # same, push artifacts naming the old repository are still accepted, and
    # the local clone was re-pointed automatically.
    github_repo: iascus/rot3k
    former_github_repos: [iascus/rt3k]
    local_path: /var/lib/git-bridge/repos/rot3k   # persistent bare clone
    remote: origin
    # remote_url defaults to https://github.com/<github_repo>.git

    # Integration branch: read only; exported as the complete snapshot.
    integration_branch: main
    # Working branch: the only branch a push may advance; exported as the
    # integration -> working tree overlay.
    working_branch: design-docs

    # Staged paths matching these globs are rejected.
    denied_paths:
      - .github/**

    # Always run first (built in): git diff --cached --check
    # Additional commands run in the temporary worktree, no shell, minimal env.
    validation: []
    #  - name: markdown-lint
    #    command: ["markdownlint-cli2", "**/*.md"]
    #    timeout_seconds: 120

    export:
      drive_root: ChatGPT/rot3k
      # The repository's own manifest (PROJECT_SOURCE_FILES block) defines the
      # exported files; each branch is read with its own manifest.
      manifest: docs/design/MANIFEST.md
      # Stable names (defaults shown):
      # snapshot_name: rot3k-snapshot.zip
      # working_diff_name: rot3k-working.diff

    # After each successful push, open a PR working -> integration unless one
    # is already open. Needs the token permission 'Pull requests: Read and write'.
    pull_request:
      draft: false

    # After the PR working -> integration is squash-merged, Refresh rebases the
    # working branch onto the integration branch (only commits made after the
    # merge) and updates it with a lease-guarded force push. A push never
    # rebases; it warns while a rebase is pending.
    rebase_after_squash_merge: true

  cyberpunk-tactics:
    github_repo: iascus/cyberpunk-tactics
    local_path: /var/lib/git-bridge/repos/cyberpunk-tactics
    integration_branch: main
    working_branch: design-docs
    denied_paths:
      - .github/**
    export:
      drive_root: ChatGPT/cyberpunk-tactics
      manifest: docs/design/MANIFEST.md
    pull_request: {}
    rebase_after_squash_merge: true
