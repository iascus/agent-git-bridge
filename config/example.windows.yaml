# Example configuration for a Windows host (e.g. the PC running Tailscale).
# Copy to %USERPROFILE%\.config\agent-git-bridge\config.yaml and adjust.
# All secrets are separate files referenced by path; none belong in Git.

work_dir: C:/Users/YOU/AppData/Local/agent-git-bridge/work
audit_log: C:/Users/YOU/AppData/Local/agent-git-bridge/audit.jsonl
github_token_file: C:/Users/YOU/.config/agent-git-bridge/github-token.txt

# Use the Windows certificate store for HTTPS (the bridge ignores the
# system/global Git config on purpose, so this must be stated here).
git_extra_config:
  - http.sslBackend=schannel

git_identity:                    # author and committer of every bridge commit
  name: iascus
  email: 127579634+iascus@users.noreply.github.com

server:
  host: 127.0.0.1          # loopback only; Tailscale Serve provides HTTPS
  port: 8000
  bearer_token_file: C:/Users/YOU/.config/agent-git-bridge/bearer-token.txt

snapshot:
  transport: google_drive

google:
  client_secrets_file: C:/Users/YOU/.config/agent-git-bridge/google-client.json
  token_file: C:/Users/YOU/.config/agent-git-bridge/google-token.json

repositories:
  rot3k:
    github_repo: iascus/rot3k
    former_github_repos: [iascus/rt3k]   # renamed on GitHub; old name still accepted
    local_path: C:/Users/YOU/AppData/Local/agent-git-bridge/repos/rot3k.git
    integration_branch: main          # complete snapshot (read only)
    working_branch: design-docs       # overlay; the only branch pushes advance
    denied_paths: [.github/**]
    export:
      drive_root: ChatGPT/rot3k
      manifest: docs/design/MANIFEST.md   # the repo's own source inventory
    # After each push, open a PR working -> integration unless one is open.
    pull_request:
      draft: false
    # Refresh rebases the working branch after its PR was squash-merged.
    rebase_after_squash_merge: true

  cyberpunk-tactics:
    github_repo: iascus/cyberpunk-tactics
    local_path: C:/Users/YOU/AppData/Local/agent-git-bridge/repos/cyberpunk-tactics.git
    integration_branch: main
    working_branch: design-docs       # default push target
    additional_working_branches: [gfx-assets]   # its own pair, its own PR; never auto-created
    denied_paths: [.github/**]
    export:
      drive_root: ChatGPT/cyberpunk-tactics
      manifest: docs/design/MANIFEST.md
    pull_request: {}
    rebase_after_squash_merge: true
